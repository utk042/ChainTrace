services:
  - type: web
    name: chaintrace-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: CT_DUCKDB_PATH
        value: /app/data/chaintrace.duckdb
      - key: CT_CORS_ORIGINS
        value: '["*"]'
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health
