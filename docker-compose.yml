version: '3.8'

services:
  backend:
    build: ./backend
    container_name: chaintrace-backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - CT_DUCKDB_PATH=/app/data/chaintrace.duckdb
      - CT_GEOIP_DB_PATH=/app/data/GeoLite2-City.mmdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: chaintrace-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data:
