[project]
name = "chaintrace-backend"
version = "1.0.0"
description = "AI-Powered Bitcoin Transaction Monitoring & Analysis System"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
    "networkx>=3.3",
    "python-louvain>=0.16",
    "torch>=2.4.0",
    "torch-geometric>=2.6.0",
    "scikit-learn>=1.5.0",
    "shap>=0.46.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "python-multipart>=0.0.9",
    "maxminddb>=2.6.0",
    "geoip2>=4.8.0",
    "lxml>=5.3.0",
    "aiofiles>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
